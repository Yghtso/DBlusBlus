name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (clang-debug)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build libgtest-dev

      - name: Configure
        run: cmake --preset clang-debug

      - name: Build
        run: cmake --build --preset clang-debug

      - name: Test
        run: ctest --preset clang-debug

  docs:
    name: Docs (mdBook build and link check)
    runs-on: ubuntu-24.04
    env:
      MDBOOK_VERSION: v0.4.40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build book
        run: mdbook build docs

      - name: Check links in the book
        run: python3 docs/tools/check_links.py build/book

      - name: Check links in repository Markdown
        run: python3 docs/tools/check_links.py --markdown README.md AGENTS.md devlog/*.md docs/*.md docs/architecture/*.md docs/verification/*.md
