name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (clang-debug)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build libgtest-dev

      - name: Configure
        run: cmake --preset clang-debug

      - name: Build
        run: cmake --build --preset clang-debug

      - name: Test
        run: ctest --preset clang-debug
